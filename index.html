<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12345a">
  <title>봄봄 케어</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=202607271130">
</head>
<body class="login-mode">
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1><span class="title-icon" aria-hidden="true">♥</span>봄봄 케어</h1><p class="header-subtitle">오늘의 돌봄을 기록합니다</p>
      </div>
      <button class="small-button hidden" id="logoutButton" type="button">나가기</button>
    </header>

    <main>
      <section class="panel setup-panel hidden" id="setupPanel">
        <label for="gasUrl">GAS Web App URL</label>
        <input id="gasUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
      </section>

      <section class="panel" id="loginPanel">
        <div class="login-fields">
          <label for="providerId">
            <span>제공자 ID</span>
            <input id="providerId" autocomplete="off" autocapitalize="characters" placeholder="ID">
          </label>
          <label for="pin">
            <span>PIN</span>
            <input id="pin" type="tel" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="4자리">
          </label>
        </div>
        <button id="loginButton" type="button">로그인</button>
      </section>

      <section class="provider-bar hidden" id="providerBar">
        <div class="provider-line">
          <strong id="providerName">-</strong>
          <span class="heart">♥</span>
          <strong id="currentRecipient">수여자 미지정</strong>
          <span id="monthlyPointTotal" class="point-badge">이번 달 0점</span>
        </div>
      </section>

      <section class="panel hidden" id="recordPanel">
        <label class="date-label service-date-label" for="serviceDate"><span>서비스 날짜</span><input id="serviceDate" type="date"></label>

        <div id="itemsList" class="items-list"></div>
        <button id="addItemButton" type="button" class="small-button full">제공 서비스 추가</button>
      </section>
      <section class="panel hidden" id="photoPanel">
        <h2>사진</h2>
        <div id="photoList" class="photo-list"></div>
        <div id="selectedPhotoPreview" class="photo-list"></div>
        <input id="photos" class="visually-hidden" type="file" accept="image/jpeg,image/png">

      </section>

      <section class="panel hidden" id="notePanel">
        <h2>활동기록</h2>
        <textarea id="note" rows="3" placeholder="필요할 때만 입력"></textarea>
      </section>

      <section class="panel hidden" id="savePanel">
        <button id="saveButton" type="button">저장</button>
        <button id="cancelEditButton" type="button" class="secondary-button hidden">선택 취소</button>
      </section>

      <section class="panel hidden" id="historyPanel">
        <div class="section-title">
          <h2>내 기록</h2>
          <span id="historyPointTotal" class="point-badge muted">0점</span>
          <button id="refreshHistoryButton" type="button" class="small-button muted">조회</button>
        </div>
        <div class="history-range">
          <label for="historyFromDate">시작일<input id="historyFromDate" type="date"></label>
          <label for="historyToDate">종료일<input id="historyToDate" type="date"></label>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>

    <div class="toast hidden" id="toast"></div>
  </div>

  <template id="itemTemplate">
    <div class="item-row">
      <div class="item-head">
        <span>제공 서비스</span>
        <button class="remove-item" type="button">서비스 삭제</button>
      </div>
      <select class="item-type" aria-label="서비스 종류"></select>
      <div class="item-time-line">
        <label>시작<div class="time-control item-start"></div></label>
        <label>종료<div class="time-control item-end"></div></label>
      </div>
    </div>
  </template>

  <script src="./app.js?v=202607271230"></script>
</body>
</html>
